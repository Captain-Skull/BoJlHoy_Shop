services:
  bot:
    build: .
    container_name: bojlhoy-shop
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    environment:
      # ~75% of mem_limit so Node runs GC before Docker OOM-kills it
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./secrets:/app/secrets:ro
      # Webhook mode only: mount the cert and set CERT_PATH=/certs/webhook_cert.pem in .env
      # - /root/certs:/certs:ro
